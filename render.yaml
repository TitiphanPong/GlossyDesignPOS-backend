services:
  - type: web
    name: glossy-pos-backend
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_PRIVATE
        sync: false
      - key: AWS_S3_KMS_KEY_ID
        sync: false
      - key: ORDER_NUMBER_TIMEZONE
        value: Asia/Bangkok
